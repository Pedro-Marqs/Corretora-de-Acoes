spring.application.name=gestao-acoes-corretoras
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.profiles.group.local=dev

app.time-zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.session.jdbc.initialize-schema=never

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.security.session-cookie-secure=true
app.http.connect-timeout=${APP_HTTP_CONNECT_TIMEOUT:3s}
app.http.read-timeout=${APP_HTTP_READ_TIMEOUT:5s}

app.integrations.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br/api}
app.integrations.brasil-api.connect-timeout=${BRASIL_API_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.brasil-api.read-timeout=${BRASIL_API_READ_TIMEOUT:${APP_HTTP_READ_TIMEOUT:5s}}
app.integrations.via-cep.base-url=${VIA_CEP_BASE_URL:https://viacep.com.br/ws}
app.integrations.via-cep.connect-timeout=${VIA_CEP_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.via-cep.read-timeout=${VIA_CEP_READ_TIMEOUT:${APP_HTTP_READ_TIMEOUT:5s}}
app.integrations.cvm.base-url=${CVM_BASE_URL:https://dados.cvm.gov.br}
app.integrations.cvm.dataset-path=${CVM_DATASET_PATH:/dados/INTERMED/CAD/DADOS/cad_intermed.zip}
app.integrations.cvm.connect-timeout=${CVM_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.cvm.read-timeout=${CVM_READ_TIMEOUT:30s}
app.integrations.cvm.snapshot-validity=${CVM_SNAPSHOT_VALIDITY:24h}
app.integrations.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev/api}
app.integrations.brapi.token=${BRAPI_TOKEN:}
app.integrations.brapi.connect-timeout=${BRAPI_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.brapi.read-timeout=${BRAPI_READ_TIMEOUT:${APP_HTTP_READ_TIMEOUT:5s}}
app.integrations.twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
app.integrations.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
app.integrations.twelve-data.connect-timeout=${TWELVE_DATA_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.twelve-data.read-timeout=${TWELVE_DATA_READ_TIMEOUT:${APP_HTTP_READ_TIMEOUT:5s}}
app.integrations.awesome-api.base-url=${AWESOME_API_BASE_URL:https://economia.awesomeapi.com.br}
app.integrations.awesome-api.api-key=${AWESOME_API_KEY:}
app.integrations.awesome-api.connect-timeout=${AWESOME_API_CONNECT_TIMEOUT:${APP_HTTP_CONNECT_TIMEOUT:3s}}
app.integrations.awesome-api.read-timeout=${AWESOME_API_READ_TIMEOUT:${APP_HTTP_READ_TIMEOUT:5s}}
