spring.datasource.url=jdbc:h2:mem:gestao-acoes-corretoras;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/h2
spring.session.jdbc.initialize-schema=never
app.security.session-cookie-secure=false
