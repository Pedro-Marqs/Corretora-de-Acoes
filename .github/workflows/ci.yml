
name: CI - Corretora de Acoes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Gerar build
        run: npm run build

  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes e verificar cobertura
        run: mvn --batch-mode clean verify

      - name: Verificar testes PostgreSQL
        shell: bash
        run: |
          report="target/surefire-reports/TEST-com.projeto.gestao.repository.PostgreSqlMigrationTests.xml"
          if [[ ! -f "$report" ]]; then
            echo "::error::PostgreSqlMigrationTests não gerou relatório; os testes PostgreSQL não foram executados."
            exit 1
          fi
          if ! grep -Eq '<testsuite[^>]*tests="[1-9][0-9]*"' "$report" \
              || ! grep -Eq '<testsuite[^>]*errors="0"' "$report" \
              || ! grep -Eq '<testsuite[^>]*failures="0"' "$report" \
              || ! grep -Eq '<testsuite[^>]*skipped="0"' "$report"; then
            echo "::error::PostgreSqlMigrationTests não executou integralmente."
            cat "$report"
            exit 1
          fi
